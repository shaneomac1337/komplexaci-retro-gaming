name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday 07:00 UTC — staggered an hour after the security workflow
    # cron so the two don't compete for runner minutes.
    - cron: '0 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1521896cd211af95be3f02edf6f436e10b819c27  # v3.35.4
        with:
          languages: javascript-typescript
          # Use the default + security-extended query packs. security-extended
          # adds higher-precision rules at the cost of some build time.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1521896cd211af95be3f02edf6f436e10b819c27  # v3.35.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1521896cd211af95be3f02edf6f436e10b819c27  # v3.35.4
        with:
          category: "/language:javascript-typescript"
