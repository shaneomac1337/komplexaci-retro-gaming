name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday 07:00 UTC — staggered an hour after the security workflow
    # cron so the two don't compete for runner minutes.
    - cron: '0 7 * * 1'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Top-level perms minimal; security-events:write is granted at job-level
# only on the analyze job that actually uploads SARIF (scorecard's
# Token-Permissions check warns when a write is at the workflow level).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      # Audit-mode network egress monitor (consistent with security.yml).
      # CodeQL downloads the language pack + uploads SARIF — many legit
      # destinations; harden-runner just records the baseline.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: javascript-typescript
          # Use the default + security-extended query packs. security-extended
          # adds higher-precision rules at the cost of some build time.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:javascript-typescript"
