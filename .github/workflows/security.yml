name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday 06:00 UTC — catches new advisories against pinned deps.
    - cron: '0 6 * * 1'
  # Manual trigger from the Actions tab — handy for re-running after a
  # config tweak or after rotating UPLOAD_SECRET, without forcing a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production runtime)
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor. Logs every outbound connection
      # the runner makes (npm install, action downloads, telemetry) so a
      # malicious dep / action exfiltrating data via a curl-back is visible
      # in the workflow's "Harden Runner" tab. Switch egress-policy to
      # `block` once the legit allow-list is captured.
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Production runtime only. Dev tooling advisories (vite, wrangler, etc.)
      # do not ship to end users — see workers/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=moderate
      # Supply-chain integrity: verify every installed package has a valid
      # signature from the npm registry. Catches packages published without
      # a registry signature (one of the few signals available against
      # an account-takeover supply-chain attack).
      - name: Verify package signatures
        run: npm audit signatures

  typecheck:
    name: tsc (frontend + workers)
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor. Logs every outbound connection
      # the runner makes (npm install, action downloads, telemetry) so a
      # malicious dep / action exfiltrating data via a curl-back is visible
      # in the workflow's "Harden Runner" tab. Switch egress-policy to
      # `block` once the legit allow-list is captured.
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Frontend typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Worker typecheck
        run: |
          npx tsc --noEmit \
            --types @cloudflare/workers-types \
            --target es2022 --module esnext --moduleResolution bundler \
            --strict --skipLibCheck \
            workers/r2-uploader/src/index.ts \
            workers/upload-proxy/src/index.ts
      - name: Worker JS syntax check
        run: node --check scripts/r2-fetch-worker.js

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor. Logs every outbound connection
      # the runner makes (npm install, action downloads, telemetry) so a
      # malicious dep / action exfiltrating data via a curl-back is visible
      # in the workflow's "Harden Runner" tab. Switch egress-policy to
      # `block` once the legit allow-list is captured.
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # ESLint 9 flat config (eslint.config.js) handles file matching itself —
      # --ext is ignored / errors in flat-config mode, so just match the
      # `npm run lint` script.
      - run: npm run lint

  test:
    name: vitest (shared worker validators)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Regression suite for the shared Worker security validators
      # (workers/shared/validators.ts). Catches accidental loosening of
      # the key allow-list or breakage of the constant-time secret
      # comparison. See workers/shared/validators.test.ts.
      - run: npm test
