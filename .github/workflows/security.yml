name: security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday 06:00 UTC — catches new advisories against pinned deps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Production runtime only. Dev tooling advisories (vite, wrangler, etc.)
      # do not ship to end users — see workers/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=moderate
      # Supply-chain integrity: verify every installed package has a valid
      # signature from the npm registry. Catches packages published without
      # a registry signature (one of the few signals available against
      # an account-takeover supply-chain attack).
      - name: Verify package signatures
        run: npm audit signatures

  typecheck:
    name: tsc (frontend + workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Frontend typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Worker typecheck
        run: |
          npx tsc --noEmit \
            --types @cloudflare/workers-types \
            --target es2022 --module esnext --moduleResolution bundler \
            --strict --skipLibCheck \
            workers/r2-uploader/src/index.ts \
            workers/upload-proxy/src/index.ts
      - name: Worker JS syntax check
        run: node --check scripts/r2-fetch-worker.js

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # ESLint 9 flat config (eslint.config.js) handles file matching itself —
      # --ext is ignored / errors in flat-config mode, so just match the
      # `npm run lint` script.
      - run: npm run lint
