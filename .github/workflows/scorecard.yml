name: scorecard

on:
  push:
    branches: [master]
  schedule:
    # Weekly Tuesday 06:00 UTC — staggered from the other security crons
    # so the runner load is spread across the week.
    - cron: '0 6 * * 2'

# OpenSSF Scorecard inspects branch protection, dependency update tooling,
# pinned actions, code review configuration, etc. and publishes a score to
# the Security tab. Read-only against the repo; needs id-token for OIDC
# attestation of the SARIF upload.
permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
