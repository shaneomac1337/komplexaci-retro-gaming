name: scorecard

on:
  push:
    branches: [master]
  schedule:
    # Weekly Tuesday 06:00 UTC — staggered from the other security crons
    # so the runner load is spread across the week.
    - cron: '0 6 * * 2'

# OpenSSF Scorecard inspects branch protection, dependency update tooling,
# pinned actions, code review configuration, etc. and publishes a score to
# the Security tab. Read-only against the repo; needs id-token for OIDC
# attestation of the SARIF upload.
permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor (consistent with security.yml).
      # Scorecard itself reaches GitHub API + sigstore + various best-practice
      # signal sources — lots of legitimate destinations to capture.
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2  # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@1521896cd211af95be3f02edf6f436e10b819c27  # v3.35.4
        with:
          sarif_file: scorecard-results.sarif
