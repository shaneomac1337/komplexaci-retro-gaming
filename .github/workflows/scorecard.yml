name: scorecard

on:
  push:
    branches: [master]
  schedule:
    # Weekly Tuesday 06:00 UTC — staggered from the other security crons
    # so the runner load is spread across the week.
    - cron: '0 6 * * 2'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# OpenSSF Scorecard inspects branch protection, dependency update tooling,
# pinned actions, code review configuration, etc. and publishes a score to
# the Security tab.
#
# Top-level perms must be minimal — when publish_results: true, the
# scorecard-action verifies that ONLY the analysis job has the
# security-events / id-token writes (otherwise it 400s with
# "global perm is set to write"). Job-level permissions below.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload-sarif step
      id-token: write          # OIDC attestation of the published SARIF
    steps:
      # Audit-mode network egress monitor (consistent with security.yml).
      # Scorecard itself reaches GitHub API + sigstore + various best-practice
      # signal sources — lots of legitimate destinations to capture.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: scorecard-results.sarif
