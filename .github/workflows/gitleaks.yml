name: gitleaks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual trigger — handy for ad-hoc re-scans after history rewrites.
  workflow_dispatch:

permissions:
  contents: read
  # PRs may want to comment scan results — least-privilege.
  pull-requests: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor (consistent with security.yml).
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Need full history so gitleaks can scan commit ranges and
          # produce useful findings on PRs.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          # By default the action scans only the diff for the current
          # event (push or PR), so historical false-positives like the
          # already-rotated `komplexaci-upload-2024` won't keep firing.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
