name: gitleaks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual trigger — handy for ad-hoc re-scans after history rewrites.
  workflow_dispatch:

permissions:
  contents: read
  # PRs may want to comment scan results — least-privilege.
  pull-requests: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # Audit-mode network egress monitor (consistent with security.yml).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need full history so gitleaks can scan commit ranges and
          # produce useful findings on PRs.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          # Required by gitleaks-action v2 on pull_request events (it lists
          # the PR's commits via the API); without it every PR scan fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # By default the action scans only the diff for the current
          # event (push or PR), so historical false-positives like the
          # already-rotated `komplexaci-upload-2024` won't keep firing.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
